  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebFig Icons</title>
  <style>
    :root {
      color: #143c3c;
      background: #f7faf9;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 24px;
      color: #5c7373;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .icon {
      display: grid;
      grid-template-rows: 56px auto;
      align-items: center;
      justify-items: center;
      gap: 10px;
      min-width: 0;
      padding: 16px 12px 14px;
      border: 1px solid #d9e5e2;
      border-radius: 8px;
      background: #fff;
    }

    .icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: auto;
    }

    .icon-name {
      width: 100%;
      overflow-wrap: anywhere;
      color: #254747;
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
    }
  </style>
</head>
